services:

  app:
    build:
      context: ../application
      dockerfile: Dockerfile

    container_name: devops-app

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/devopsdb
      DB_USERNAME: devopsuser
      DB_PASSWORD: devopspassword

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0

    container_name: devops-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devopsuser
      MYSQL_PASSWORD: devopspassword

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  